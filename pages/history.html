<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocuVerify | Document History</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.jpg">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
</head>
<body>
  <nav class="sidebar d-flex flex-column p-3">
    <div class="d-flex align-items-center mb-4 px-2 pt-2"><h4 class="fw-bold mb-0 text-dark"><i class="bi bi-shield-check text-primary me-2"></i>DocuVerify</h4></div>
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 text-secondary me-2 fs-5"></i> Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="upload.html"><i class="bi bi-cloud-upload text-secondary me-2 fs-5"></i> Upload Document</a></li>
      <li class="nav-item"><a class="nav-link active" href="history.html"><i class="bi bi-clock-history text-primary me-2 fs-5"></i> Document History</a></li>
      <li class="nav-item"><a class="nav-link" href="reports.html"><i class="bi bi-file-earmark-text text-secondary me-2 fs-5"></i> Analysis Reports</a></li>
      <li class="nav-item"><a class="nav-link" href="settings.html"><i class="bi bi-gear text-secondary me-2 fs-5"></i> Settings</a></li>
    </ul>
    <hr>
    <div class="px-2"><button id="logoutBtn" class="btn btn-outline-danger w-100"><i class="bi bi-box-arrow-right"></i> Logout</button></div>
  </nav>

  <main class="main-content">
    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
      <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
        <h4 class="fw-bold mb-0">Document Analysis History</h4>
        <button id="clearHistoryBtn" class="btn btn-outline-danger btn-sm">Clear History</button>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr><th>Date & Time</th><th>Document Name</th><th>Type</th><th>Classification Result</th></tr>
          </thead>
          <tbody id="historyTableBody">
            <tr><td colspan="4" class="text-center text-muted py-4">No history records found.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://eqmdiljeffdlvmaqcfru.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_cLnIGyKarOMfhyZz-reSmg_pWxWskE7';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let userId = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      userId = session.user.id;
      loadHistory();
    });

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem(`docuverify_history_${userId}`) || '[]');
      const tbody = document.getElementById('historyTableBody');
      if (history.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">No history records found.</td></tr>`;
        return;
      }
      tbody.innerHTML = history.map(h => {
        let badge = h.classification.includes('Genuine') ? 'bg-success' : (h.classification.includes('Needs') ? 'bg-info text-dark' : 'bg-danger');
        const dateStr = new Date(h.date).toLocaleString();
        return `<tr><td>${dateStr}</td><td class="fw-semibold">${h.name}</td><td>${h.type}</td><td><span class="badge ${badge}">${h.classification}</span></td></tr>`;
      }).join('');
    }

    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
      if (confirm('Clear all history?')) {
        localStorage.removeItem(`docuverify_history_${userId}`);
        loadHistory();
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await _supabase.auth.signOut();
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
